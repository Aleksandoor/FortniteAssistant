
name: Build Fortnite Assistant

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install pyinstaller pyautogui opencv-python pillow

      - name: Build EXE
        run: |
          pyinstaller --onefile --windowed --name FortniteAssistant fortnite_lobby_assistant.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: FortniteAssistant
          path: dist/FortniteAssistant.exe
